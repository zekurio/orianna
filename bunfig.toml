# Bun.serve bundles the web interface with these when running from source;
# scripts/build.ts does the same for the compiled bot. Tailwind builds the
# styles, and scripts/icons.ts keeps the icon weights the app draws.
[serve.static]
plugins = ["bun-plugin-tailwind", "./scripts/icons.ts"]

[install]
# bun-plugin-tailwind asks for the `bun` package as a peer. The bot runs on
# the Bun it's built with, so that package would only add every platform's
# Bun binary to node_modules.
peer = false
